<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | NexaBridge Solutions</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#102B46;--teal:#168F82;--light:#f4f7fa;--text:#324456}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#eef4f8,#ffffff);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(720px,100%);background:#fff;border-radius:22px;padding:48px 34px;box-shadow:0 18px 50px rgba(16,43,70,.12);text-align:center;border:1px solid #e4ebf1}
    .mark{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;background:rgba(22,143,130,.12);color:var(--teal);font-size:34px;font-weight:800}
    h1{font-family:Montserrat,Arial,sans-serif;color:var(--navy);font-size:clamp(30px,5vw,46px);margin:0 0 14px}
    p{font-size:17px;line-height:1.7;margin:0 auto 28px;max-width:590px}
    .btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:14px 22px;border-radius:10px;font-weight:700}
    .btn:hover{opacity:.92}.tag{margin-top:28px;font-size:14px;color:#6b7c8c}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✓</div>
    <h1>Thank You</h1>
    <p>Your message has been received. NexaBridge Solutions will review your inquiry and get back to you as soon as possible.</p>
    <a class="btn" href="https://nexabridgesolution.github.io/">Back to NexaBridge Solutions</a>
    <div class="tag">Connecting Businesses. Delivering Solutions.</div>
  </main>
</body>
</html>
